# The worker on Fly staging (Stage 3c; BUILD-STATUS "3c detailed design",
# item 12). No services, no IP: it only pulls work from the staging Upstash
# queue and calls the parse service over Flycast. Stopped between test
# sessions (founder's Q6, option B): `fly scale count 0 --process-group
# worker --process-group beat` / `fly scale count worker=1 beat=1`.
#
# Deploy from the repository root:
#
#     fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile \
#         --ignorefile apps/worker/Dockerfile.dockerignore --no-public-ips .
#
# Secrets (set by the founder): PARSE_SERVICE_TOKEN, DATABASE_URL, REDIS_URL,
# STORAGE_S3_*, ANTHROPIC_API_KEY and the rest listed in BUILD-STATUS item 12.

app = "docflow-worker-staging"
primary_region = "iad"

[env]
  DOCFLOW_ENV = "staging"
  PARSE_SERVICE_URL = "http://docflow-parse-staging.flycast"

# Stage 3d (founder, 2026-10-01; BUILD-STATUS "3d -- APPROVED WITH CHANGES",
# change C). Two process groups from one image:
#   worker -- takes documents, sweeps and dispatch passes from both queues.
#   beat   -- celery beat, its own process, EXACTLY ONE machine. It only sends
#             the schedule (the dispatcher's 30 s backstop, the sweeps, the
#             nightly rollup); it never runs a task itself.
# Every beat task is safe if two beats fire it (the table in BUILD-STATUS),
# so a second beat would be harmless -- but never scale `beat` above 1.
# 3c ran no beat on Fly; from 3d, run only one stack (local or Fly) against
# staging at a time (RUNBOOK 9.3).
[processes]
  worker = "celery -A app.celery_app worker --loglevel=info -Q interactive,bulk"
  beat = "celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule"

# Rolling updates each machine in place (stop, update, start), so a deploy
# never runs an old and a new beat side by side. Never deploy this app with
# --strategy canary or bluegreen: both start a new machine beside the old
# one (Fly's deploy docs, read 2026-10-01).
[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]

# beat sends a few small messages a minute: the smallest machine.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["beat"]
