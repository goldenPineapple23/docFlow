# Supabase CLI local stack -- used by CI only (Phase 5.5 Stage 0, DECISIONS.md D-148).
#
# CI runs `supabase start`, which applies every file in supabase/migrations/
# in order as the `postgres` role, exactly as the founder does by hand in the
# staging SQL Editor. scripts/ci/create_app_role.py then creates `docflow_app`
# (NOBYPASSRLS) the way SETUP.md Step 1.6 does, and the Python suites connect
# as that role -- so RLS, the Supabase roles and the `auth` schema behave as
# they do on docflow-staging.
#
# Staging and prod are configured in the Supabase dashboard, not here. Only
# the services the test suites need are switched on.

project_id = "docflow-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# docflow-staging runs PostgreSQL 17 (verified 2026-09-25: 17.6).
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
# The local mail catcher. On so the auth stack is complete, since GoTrue's
# email provider expects a mailer. Not the cause of the sign-in failure
# below -- turning it on changed nothing -- but a stack that can sign
# people in and not send them anything is a half-built one, and the invite
# and reset flows will want it. Nothing reads the mailbox: the suites
# assert on the `email_outbox` table, not on delivered mail.
enabled = true

[storage]
# On since Stage 3b: DocFlow's files live in Supabase Storage (bucket
# `docflow-files`, created by migration 0033), and CI's suites run against
# this stack's bucket through its S3 endpoint (scripts/ci/local_storage_env.py).
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# No public signup (build prompt Section 3; staging has it switched off, M16).
enable_signup = false

[auth.email]
# **`enable_signup` is deliberately absent here.** In the Supabase CLI,
# `[auth.email] enable_signup = false` does not mean "email accounts
# cannot self-register" -- it switches the email provider off entirely.
# With it set, the local stack answered every password sign-in with
# `422 email_provider_disabled`, and `/auth/v1/settings` reported
# `"email": false` even with `enabled = true` below and the mailer
# running. Invited users sign in with an email and a password (Section 3),
# so an account nobody can sign in to is not an account.
#
# No public signup is still enforced, by `[auth] enable_signup = false`
# above (GoTrue's DISABLE_SIGNUP) and by the product having no `/signup`
# route at all, which its own tests assert.
#
# Nothing caught this for three phases because no CI job had ever signed
# in: the Python suites mint their own tokens and never touch GoTrue. The
# live end-to-end suite (D-166) is the first thing here that signs in the
# way a person does, and it found this on its first run.
enabled = true
