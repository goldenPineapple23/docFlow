# Supabase CLI local stack -- used by CI only (Phase 5.5 Stage 0, DECISIONS.md D-148).
#
# CI runs `supabase start`, which applies every file in supabase/migrations/
# in order as the `postgres` role, exactly as the founder does by hand in the
# staging SQL Editor. scripts/ci/create_app_role.py then creates `docflow_app`
# (NOBYPASSRLS) the way SETUP.md Step 1.6 does, and the Python suites connect
# as that role -- so RLS, the Supabase roles and the `auth` schema behave as
# they do on docflow-staging.
#
# Staging and prod are configured in the Supabase dashboard, not here. Only
# the services the test suites need are switched on.

project_id = "docflow-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# docflow-staging runs PostgreSQL 17 (verified 2026-09-25: 17.6).
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# No public signup (build prompt Section 3; staging has it switched off, M16).
enable_signup = false

[auth.email]
# `enabled` must be stated. Declaring this table without it left the email
# provider off altogether, so the local stack answered every password
# sign-in with 422 `email_provider_disabled` -- while the intent here was
# only to switch off self-signup. That is not what staging does: DocFlow's
# invited users sign in with an email and a password (Section 3), and an
# account they cannot sign in to is not an account.
#
# Nothing caught it for three phases because no CI job had ever signed in:
# the Python suites mint their own tokens and never touch GoTrue. The live
# end-to-end suite (D-166) is the first thing here that signs in the way a
# person does, and it found this on its first run.
enabled = true
enable_signup = false
