[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-core"
version = "0.1.0"
description = "Shared DocFlow backend code: config, tenant-scoped data access, adminDataAccess, file allowlist, error catalog."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "anthropic>=0.69",
    # docflow_core.email_intake enqueues parse_and_extract directly, so the
    # producer side of Celery is a real dependency of this package, not just
    # of the api/worker apps that happen to install it too.
    "celery[redis]>=5.4",
    # docflow_core.buyers (near-duplicate buyer-name flagging) and, next
    # slice, catalog SKU fuzzy matching. Lives here rather than in the
    # worker's requirements because both the worker and the Console's
    # matching code call the same one scoring function -- see DECISIONS.md D-055.
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["docflow_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# This lint config is new as of Phase 1 (packages/core had no [tool.ruff]
# section before -- see DECISIONS.md). admin_data_access.py and db.py are
# pre-existing Phase 0 files with long SQL-literal lines that predate this
# config; fixing their line lengths is unrelated churn on tested,
# out-of-scope code, so they're exempted here rather than silently
# reformatted as a side effect of an unrelated slice.
[tool.ruff.lint.per-file-ignores]
"docflow_core/admin_data_access.py" = ["E501"]
"docflow_core/db.py" = ["E501", "E402"]
# SYSTEM_PROMPT's paragraph lines are long by nature (prose, not code); its
# exact bytes are hashed (extraction.prompt_hash) and re-run through the
# golden fixture on any change (CLAUDE.md Section 7.1), so wrapping it is a
# real edit to review, not a mechanical lint fix.
"docflow_core/extraction.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
