[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-core"
version = "0.1.0"
description = "Shared DocFlow backend code: config, tenant-scoped data access, adminDataAccess, file allowlist, error catalog."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    # 2.15.0 fixes CVE-2026-101918 (a deeply nested payload escaping as a raw
    # RecursionError); the floor keeps the vulnerable versions out.
    "pyjwt[crypto]>=2.15.0",
    "anthropic>=1.6",
    # docflow_core.extraction catches a stream dropped mid-answer, which
    # surfaces from the SDK's own transport (httpx2), not as an APIError (D-161).
    "httpx2>=2.13",
    # docflow_core.email_intake enqueues parse_and_extract directly, so the
    # producer side of Celery is a real dependency of this package, not just
    # of the api/worker apps that happen to install it too.
    "celery[redis]>=5.4",
    # docflow_core.buyers (near-duplicate buyer-name flagging) and, next
    # slice, catalog SKU fuzzy matching. Lives here rather than in the
    # worker's requirements because both the worker and the Console's
    # matching code call the same one scoring function -- see DECISIONS.md D-055.
    "rapidfuzz>=3.9",
    # docflow_core.storage: Supabase Storage through its S3-compatible endpoint
    # with a Storage-only access key (Stage 3b, Q1). Exact pins in the
    # api/worker lockfiles.
    "boto3>=1.43",
]

[project.optional-dependencies]
# The one file library core uses: openpyxl writes the .xlsx export
# (docflow_core.exports). openpyxl writes through lxml when it is installed and
# through its own writer otherwise, and the two give different bytes, so lxml
# is pinned with it: the export's pinned digest and its round trip depend on
# it. Optional because the API installs core too. Every library that opens a
# file a stranger sent lives in the parse service's image only (Stage 3c).
# Same pins as apps/worker's lockfile.
files = [
    "openpyxl==3.1.5",
    "lxml==6.1.3",
]
# Exact pins, the same as apps/worker/requirements.lock.txt, which is what
# the core CI job installs (H7).
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "python-dotenv==1.2.3",
]

[tool.setuptools.packages.find]
include = ["docflow_core*"]

# Email templates are read from disk at runtime (docflow_core.email_outbox).
[tool.setuptools.package-data]
docflow_core = ["email_templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# This lint config is new as of Phase 1 (packages/core had no [tool.ruff]
# section before -- see DECISIONS.md). admin_data_access.py and db.py are
# pre-existing Phase 0 files with long SQL-literal lines that predate this
# config; fixing their line lengths is unrelated churn on tested,
# out-of-scope code, so they're exempted here rather than silently
# reformatted as a side effect of an unrelated slice.
[tool.ruff.lint.per-file-ignores]
"docflow_core/admin_data_access.py" = ["E501"]
"docflow_core/db.py" = ["E501", "E402"]
# SYSTEM_PROMPT's paragraph lines are long by nature (prose, not code); its
# exact bytes are hashed (extraction.prompt_hash) and re-run through the
# golden fixture on any change (CLAUDE.md Section 7.1), so wrapping it is a
# real edit to review, not a mechanical lint fix.
"docflow_core/extraction.py" = ["E501"]

# Type-checked in CI since Phase 5.5 Stage 0 (review H7: CI never ran mypy on
# core, which had 24 errors).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
