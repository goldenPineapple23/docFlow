name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: web (lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

  core:
    name: core (lint, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pip install pip-audit
      - run: ruff check .
      - name: Test (no DATABASE_URL -- DB-dependent tests skip cleanly)
        run: pytest -v
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  api:
    name: api (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock.txt
      - run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit
      - run: ruff check .
      - run: mypy app
      - name: Test (recorded-fixture tests only -- DB-dependent tests skip cleanly without DATABASE_URL)
        run: pytest -v
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  worker:
    name: worker (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock.txt
      - run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit
      - run: ruff check .
      - run: mypy app
      - run: pytest -v
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit
