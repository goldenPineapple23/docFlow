name: CI

on:
  push:
  pull_request:
  # The weekly Debian snapshot job (debian-snapshot.yml) runs this whole
  # workflow with the parse image built from a newer snapshot date.
  workflow_call:
    inputs:
      debian_snapshot:
        description: "snapshot.debian.org date for the parse image, e.g. 20261008T000000Z (empty: the Dockerfile's)"
        type: string
        required: false
        default: ""

# The Python suites run against a real Supabase stack (Postgres 17 with the
# auth schema and Supabase roles), started by the Supabase CLI from
# supabase/config.toml, with every migration in supabase/migrations/ applied
# in order. They connect as the four logins migration 0036 creates (Stage
# 3e, F-1; all NOBYPASSRLS), exactly as the apps do on docflow-staging, so the
# RLS and tenant-isolation tests run on every push: DATABASE_URL is the
# process's own login (docflow_api; the worker job's is docflow_worker), and
# the others are named for the sessions that use them. Phase 5.5 Stage 0,
# DECISIONS.md D-148; review docs/REVIEW-PHASE5.md H7.
#
# Every job then fails if any test was skipped without an approval in
# .github/approved-skips.txt (scripts/ci/check_skips.py). Target: zero.
#
# Nothing below is a secret: these are throwaway values for a database that
# exists only inside the CI runner.
env:
  SUPABASE_CLI_VERSION: "2.118.0"
  SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  APP_ROLE_PASSWORD: ci-local-only
  DATABASE_URL: postgresql://docflow_api:ci-local-only@127.0.0.1:54322/postgres
  API_DATABASE_URL: postgresql://docflow_api:ci-local-only@127.0.0.1:54322/postgres
  WORKER_DATABASE_URL: postgresql://docflow_worker:ci-local-only@127.0.0.1:54322/postgres
  ADMIN_DATABASE_URL: postgresql://docflow_admin:ci-local-only@127.0.0.1:54322/postgres
  STRIPE_DATABASE_URL: postgresql://docflow_stripe:ci-local-only@127.0.0.1:54322/postgres
  REDIS_URL: redis://127.0.0.1:6379/0
  SUPABASE_JWT_SECRET: ci-local-only-jwt-secret-not-used-anywhere-else
  DOCUMENT_URL_SIGNING_SECRET: ci-local-only-signing-secret

# Every job runs on ubuntu-24.04, not ubuntu-latest: the parse sandbox tests
# depend on the runner's kernel, cgroup v2 and network setup, and
# ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Moving to a new image is
# a change made and tested on its own branch, never a surprise on an
# unrelated PR. The actions are the Node 24 majors (Node 20 is deprecated).
jobs:
  web:
    name: web (lint, typecheck, test, build, e2e, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build MUST come before `tsc --noEmit`. Next generates the global
      # route types -- `LayoutProps`, `PageProps` -- into `.next/types` as
      # part of the build, and `src/app/layout.tsx` uses `LayoutProps`. On a
      # clean checkout those types do not exist yet, so a typecheck run first
      # fails with "Cannot find name 'LayoutProps'". This job had never
      # passed in CI for exactly that reason; see DECISIONS.md D-087.
      - run: npm run build
      - run: npx tsc --noEmit
      # Component tests before the browser: they are seconds, and a failure
      # here explains an e2e failure that would otherwise take a browser to
      # diagnose.
      - name: Component tests (vitest)
        run: npm test
      # The review flow in a real browser (CLAUDE.md Section 6, Phase 3).
      # The API is stubbed at the network boundary -- its own behaviour is
      # proven against real Postgres in the api job below.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (playwright)
        run: npm run test:e2e
      # Dev dependencies stay in the audit. It fails on every high or critical
      # advisory except the ones listed one by one, each with a reason and a
      # review date, in .github/audit-exceptions.txt. An exception ends on its
      # review date: the job warns for 7 days before, then fails again. npm
      # exits non-zero when it finds anything, so its exit code is dropped and
      # the check reads the report; a report it can't read fails.
      # The second report leaves dev dependencies out and can only add a
      # failure: an exception is for a dev-only advisory, so an excepted
      # advisory that shows up there too fails the job.
      - name: Dependency audit (fail on high/critical; exceptions in .github/audit-exceptions.txt)
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-runtime.json || true
          python3 "${{ github.workspace }}/scripts/ci/npm_audit.py" web npm-audit.json npm-audit-runtime.json

  web-live:
    name: web-live (the review screen against the real API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        run: supabase start
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      # The API must verify tokens with the same secret the local GoTrue
      # signs them with, and the browser bundle needs that stack's URL and
      # anon key compiled into it. Both come from the running stack rather
      # than being written down twice.
      - name: Read the local stack's keys
        run: |
          supabase status -o env | sed 's/^/export /' > /tmp/supabase.env
          . /tmp/supabase.env
          # Named loudly if the CLI ever renames one of these, rather than
          # letting the job fail later as an unexplained 401.
          for required in API_URL ANON_KEY SERVICE_ROLE_KEY JWT_SECRET; do
            if [ -z "$(eval echo \"\$$required\")" ]; then
              echo "supabase status -o env did not provide $required" >&2
              exit 1
            fi
          done
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          # Set here, not on the build step, so the guard below sees every
          # address the browser will be given before the build bakes it in.
          echo "NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
      # This job seeds and deletes real rows, so it says out loud which
      # database it is about to do that to. Staging holds a paying
      # customer's data one day; a job that could reach it must fail here,
      # not quietly succeed. (It cannot: `.env` is gitignored so nothing
      # points at staging in a runner, no repository secret is referenced
      # by this workflow, and `database_url` defaults to empty rather than
      # to anything real. This step is the assertion of that, not the only
      # thing standing in the way.)
      - name: Refuse to run against anything but this runner's own stack
        run: |
          # Everything the server talks to, and -- just as important -- every
          # address compiled into the browser bundle. The browser in this
          # suite calls the NEXT_PUBLIC_* ones, not DATABASE_URL, so a wrong
          # value there would have the test sign in against a real project
          # while the assertions still passed.
          checked=0
          while IFS='=' read -r name value; do
            [ -n "$name" ] || continue
            if [ -z "$value" ]; then
              echo "$name is not set; this job needs it" >&2
              exit 1
            fi
            case "$value" in
              http://127.0.0.1*|http://localhost*|postgresql://*@127.0.0.1:*|postgresql://*@localhost:*)
                echo "$name -> this runner, good" ;;
              *)
                echo "$name is not an address on this runner: refusing to seed or delete anything" >&2
                exit 1 ;;
            esac
            checked=$((checked + 1))
          done <<EOF
          DATABASE_URL=$DATABASE_URL
          API_DATABASE_URL=$API_DATABASE_URL
          WORKER_DATABASE_URL=$WORKER_DATABASE_URL
          ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL
          STRIPE_DATABASE_URL=$STRIPE_DATABASE_URL
          SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
          EOF
          # If someone adds a NEXT_PUBLIC_*_URL and forgets this list, say so
          # rather than letting it through unchecked.
          declared=$(env | grep -c '^NEXT_PUBLIC_.*_URL=' || true)
          if [ "$declared" -gt 2 ]; then
            echo "A NEXT_PUBLIC_*_URL exists that this guard does not check:" >&2
            env | grep '^NEXT_PUBLIC_.*_URL=' >&2
            exit 1
          fi
          echo "$checked addresses checked."
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/api/requirements.lock.txt
      - run: pip install --no-deps -e packages/core
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python scripts/ci/create_logins.py
      - name: Start the API
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
        working-directory: apps/api
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Nothing is stubbed here: a real browser, the real API, real Postgres,
      # real RLS and a real sign-in (DECISIONS.md D-166). It has its own job
      # because it needs a database and two servers, and because a failure
      # here means something different from a failure in the stubbed suite.
      # The suite builds the app itself (playwright.live.config.ts), into
      # its own directory, with this job's NEXT_PUBLIC_* compiled in.
      - name: Live end-to-end tests (playwright)
        run: npm run test:e2e:live
        working-directory: apps/web
        env:
          DOCFLOW_PYTHON: python
      - name: The API's log, if anything failed
        if: failure()
        run: cat /tmp/api.log

  core:
    name: core (lint, test, audit)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        working-directory: ${{ github.workspace }}
        run: supabase start
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      # Pinned, not ranges (H7): the worker's lockfile holds every core
      # dependency, the `files` extras and the lint/type/test tools.
      - id: deps
        run: pip install -r ../../apps/worker/requirements.lock.txt
      - id: core
        run: pip install --no-deps -e .
      - run: pip install pip-audit
      # Founder's Q5 condition 2 (Stage 3e): the reverse script is tested, not
      # just checked in. Before the logins are turned on, since the reverse
      # drops the roles and forward creates them again.
      - name: Migration 0036 forward -> reverse -> forward (against staging's pre-0036 snapshot)
        id: roundtrip
        run: python "${{ github.workspace }}/scripts/ci/migration_roundtrip.py"
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python "${{ github.workspace }}/scripts/ci/create_logins.py"
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy docflow_core
      - name: Test (against the local Supabase stack, as the four logins)
        id: test
        run: pytest -v --junitxml=junit.xml
      - name: No unapproved skipped tests
        if: success() || failure()
        env:
          # Which earlier step failed, so a missing test report names it.
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" core junit.xml
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  api:
    name: api (lint, typecheck, test, audit)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        working-directory: ${{ github.workspace }}
        run: supabase start
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - id: deps
        run: pip install -r requirements.lock.txt
      - id: core
        run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python "${{ github.workspace }}/scripts/ci/create_logins.py"
      # Stage 3c: the catalog tests run the worker's parse step
      # (catalog_import.run_parse), which reads through the real parse service
      # image, as in the worker job.
      - uses: docker/setup-buildx-action@v4
      - name: Build the parse service image
        id: parse_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/parse/Dockerfile
          tags: docflow-parse:ci
          load: true
          build-args: ${{ inputs.debian_snapshot && format('DEBIAN_SNAPSHOT={0}', inputs.debian_snapshot) || '' }}
          cache-from: type=gha,scope=parse
      - name: Start the parse service (production mode, isolation on)
        id: parse_service
        env:
          PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci serve
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy app
      - name: Test (against the local Supabase stack, as the four logins; live_api deselected)
        id: test
        env:
          # Never PARSE_SERVICE_TOKEN here: the API doesn't hold the parse
          # token. Only the harness that runs worker code reads this name
          # (tests/conftest.py as_the_worker; test_parse_token_boundary.py).
          WORKER_HARNESS_PARSE_TOKEN: ci-parse-token-not-a-secret
        run: pytest -v --junitxml=junit.xml
      - name: No unapproved skipped tests
        if: success() || failure()
        env:
          # Which earlier step failed, so a missing test report names it.
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" api junit.xml
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  worker:
    name: worker (lint, typecheck, test, audit)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/worker
    # The worker's own login (Stage 3e): its tenant sessions run as
    # docflow_worker, as on Fly.
    env:
      DATABASE_URL: postgresql://docflow_worker:ci-local-only@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        working-directory: ${{ github.workspace }}
        run: supabase start
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - id: deps
        run: pip install -r requirements.lock.txt
      - id: core
        run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python "${{ github.workspace }}/scripts/ci/create_logins.py"
      # Stage 3c: the worker no longer opens files. Its tests read through the
      # real parse service image (isolation on, production mode), built here
      # from the parse job's layer cache.
      - uses: docker/setup-buildx-action@v4
      - name: Build the parse service image
        id: parse_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/parse/Dockerfile
          tags: docflow-parse:ci
          load: true
          build-args: ${{ inputs.debian_snapshot && format('DEBIAN_SNAPSHOT={0}', inputs.debian_snapshot) || '' }}
          cache-from: type=gha,scope=parse
      - name: Start the parse service (production mode, isolation on)
        id: parse_service
        env:
          PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci serve
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy app
      - name: Test (against the local Supabase stack, as the four logins)
        id: test
        env:
          PARSE_SERVICE_URL: http://127.0.0.1:8100
          PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
          # Test F5 kills and restarts this container mid-request.
          PARSE_CONTAINER: docflow-parse
        run: pytest -v --junitxml=junit.xml
      - name: No unapproved skipped tests
        if: success() || failure()
        env:
          # Which earlier step failed, so a missing test report names it.
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" worker junit.xml
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  parse:
    # Stage 3c: the parse service. CI is the only place before Fly where the
    # real sandbox runs (dev is Windows): this job builds the production
    # image and exercises the real namespaces, cgroups (v2 here; Fly is v1,
    # so the Fly B tests gate production, RUNBOOK 8.1), seccomp and limits.
    name: parse service (lint, unit, image, sandbox, limits, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/parse
    env:
      PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
      # Test D2: re-encoded images are compared by size off the machine the
      # baseline was recorded on (tests/test_parity.py says why).
      PARITY_REENCODED: size
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/parse/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - id: deps
        run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - id: core
        run: pip install --no-deps -e ../../packages/core -e .
      - run: pip install pip-audit
      - name: Install LibreOffice (the in-process .doc tests)
        id: libreoffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy parse_service
      - name: Unit tests (in-process; logic only, never proof of isolation)
        id: unit
        run: pytest -v --junitxml=junit-unit.xml
      - name: No unapproved skipped tests (unit)
        if: success() || failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" parse junit-unit.xml
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/parse/Dockerfile
          tags: docflow-parse:ci
          load: true
          build-args: ${{ inputs.debian_snapshot && format('DEBIAN_SNAPSHOT={0}', inputs.debian_snapshot) || '' }}
          cache-from: type=gha,scope=parse
          cache-to: type=gha,mode=max,scope=parse
      - name: "E1: refuses to start without the privileges isolation needs"
        id: e1
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci e1
      - name: "E4: refuses to start without a working memory cap"
        id: e4
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci e4
      - name: "E3: start the service (production mode); its canary log"
        id: serve
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci serve
      - name: "HTTP tests against the real image (C1, C2, D1, D2, D3, N4)"
        id: http
        env:
          PARSE_SERVICE_URL: http://127.0.0.1:8100
        run: pytest -v tests/test_parity.py tests/test_service.py --junitxml=junit-http.xml
      - name: No unapproved skipped tests (HTTP)
        if: success() || failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" parse junit-http.xml
      - name: "Self-tests in the real sandbox (A, S, B), each with its control"
        id: selftest
        if: success() || failure()
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci selftest
      - name: The self-test evidence, as annotations
        if: success() || failure()
        run: python "${{ github.workspace }}/scripts/ci/selftest_annotations.py" parse-selftest.txt
      - name: Keep the self-test evidence
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: parse-selftest
          path: apps/parse/parse-selftest.txt
          if-no-files-found: warn
      - name: The service's log
        if: success() || failure()
        run: docker logs docflow-parse 2>&1 | tail -200 || true
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit
