name: CI

on:
  push:
  pull_request:
  # The weekly Debian snapshot job (debian-snapshot.yml) runs this whole
  # workflow with the parse image built from a newer snapshot date.
  workflow_call:
    inputs:
      debian_snapshot:
        description: "snapshot.debian.org date for the parse image, e.g. 20261008T000000Z (empty: the Dockerfile's)"
        type: string
        required: false
        default: ""

# The Python suites run against a real Supabase stack (Postgres 17 with the
# auth schema and Supabase roles), started by the Supabase CLI from
# supabase/config.toml, with every migration in supabase/migrations/ applied
# in order. They connect as the four logins migration 0036 creates (Stage
# 3e, F-1; all NOBYPASSRLS), exactly as the apps do on docflow-staging, so the
# RLS and tenant-isolation tests run on every push: DATABASE_URL is the
# process's own login (docflow_api; the worker job's is docflow_worker), and
# the others are named for the sessions that use them. Phase 5.5 Stage 0,
# DECISIONS.md D-148; review docs/REVIEW-PHASE5.md H7.
#
# Every job then fails if any test was skipped without an approval in
# .github/approved-skips.txt (scripts/ci/check_skips.py). Target: zero.
#
# Nothing below is a secret: these are throwaway values for a database that
# exists only inside the CI runner.
env:
  SUPABASE_CLI_VERSION: "2.118.0"
  SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  APP_ROLE_PASSWORD: ci-local-only
  DATABASE_URL: postgresql://docflow_api:ci-local-only@127.0.0.1:54322/postgres
  API_DATABASE_URL: postgresql://docflow_api:ci-local-only@127.0.0.1:54322/postgres
  WORKER_DATABASE_URL: postgresql://docflow_worker:ci-local-only@127.0.0.1:54322/postgres
  ADMIN_DATABASE_URL: postgresql://docflow_admin:ci-local-only@127.0.0.1:54322/postgres
  STRIPE_DATABASE_URL: postgresql://docflow_stripe:ci-local-only@127.0.0.1:54322/postgres
  REDIS_URL: redis://127.0.0.1:6379/0
  SUPABASE_JWT_SECRET: ci-local-only-jwt-secret-not-used-anywhere-else
  DOCUMENT_URL_SIGNING_SECRET: ci-local-only-signing-secret

# Every job runs on ubuntu-24.04, not ubuntu-latest: the parse sandbox tests
# depend on the runner's kernel, cgroup v2 and network setup, and
# ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Moving to a new image is
# a change made and tested on its own branch, never a surprise on an
# unrelated PR. The actions are the Node 24 majors (Node 20 is deprecated).
jobs:
  web:
    name: web (lint, typecheck, test, build, e2e, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        # Two commits: the dependency audit compares a pull request's merge
        # commit with its first parent (scripts/ci/deps_changed.sh; D-219).
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build MUST come before `tsc --noEmit`. Next generates the global
      # route types -- `LayoutProps`, `PageProps` -- into `.next/types` as
      # part of the build, and `src/app/layout.tsx` uses `LayoutProps`. On a
      # clean checkout those types do not exist yet, so a typecheck run first
      # fails with "Cannot find name 'LayoutProps'". This job had never
      # passed in CI for exactly that reason; see DECISIONS.md D-087.
      - run: npm run build
      - run: npx tsc --noEmit
      # Component tests before the browser: they are seconds, and a failure
      # here explains an e2e failure that would otherwise take a browser to
      # diagnose.
      - name: Component tests (vitest)
        run: npm test
      # The review flow in a real browser (CLAUDE.md Section 6, Phase 3).
      # The API is stubbed at the network boundary -- its own behaviour is
      # proven against real Postgres in the api job below.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (playwright)
        run: npm run test:e2e
      # D-219: a high or critical advisory in a runtime dependency blocks
      # only when apps/web/package.json or package-lock.json changed;
      # otherwise it warns, and the daily audit (dependency-audit.yml)
      # blocks on it. A dev-only one always warns. There are no exceptions.
      # npm exits non-zero when it finds anything, so its exit code is
      # dropped and the check reads both reports; a report it can't read
      # fails in every case.
      - name: Did a dependency file change? (decides whether the audit blocks; D-219)
        id: deps_changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash "${{ github.workspace }}/scripts/ci/deps_changed.sh" apps/web/package.json apps/web/package-lock.json
      - name: Dependency audit (runtime high/critical blocks when a package file changed; dev warns; D-219)
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-runtime.json || true
          python3 "${{ github.workspace }}/scripts/ci/npm_audit.py" web npm-audit.json npm-audit-runtime.json --blocking "${{ steps.deps_changed.outputs.blocking }}"

  web-live:
    name: web-live (the review screen against the real API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2.1.2
        # Normally under 10 s; hung 70 min on 2026-10-26 (run #469), cause
        # unknown. Past 5 min the job fails instead (D-218).
        timeout-minutes: 5
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Show what is listening on port 54322 before the stack starts (read-only; D-199 flake 3)
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" before
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        run: supabase start
      - name: Show what is listening on port 54322 after the stack failed to start, and every container (read-only; D-199 flake 3)
        if: failure() && steps.supabase.outcome == 'failure'
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" after
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      # The API must verify tokens with the same secret the local GoTrue
      # signs them with, and the browser bundle needs that stack's URL and
      # anon key compiled into it. Both come from the running stack rather
      # than being written down twice.
      - name: Read the local stack's keys
        run: |
          supabase status -o env | sed 's/^/export /' > /tmp/supabase.env
          . /tmp/supabase.env
          # Named loudly if the CLI ever renames one of these, rather than
          # letting the job fail later as an unexplained 401.
          for required in API_URL ANON_KEY SERVICE_ROLE_KEY JWT_SECRET; do
            if [ -z "$(eval echo \"\$$required\")" ]; then
              echo "supabase status -o env did not provide $required" >&2
              exit 1
            fi
          done
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          # Set here, not on the build step, so the guard below sees every
          # address the browser will be given before the build bakes it in.
          echo "NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
      # This job seeds and deletes real rows, so it says out loud which
      # database it is about to do that to. Staging holds a paying
      # customer's data one day; a job that could reach it must fail here,
      # not quietly succeed. (It cannot: `.env` is gitignored so nothing
      # points at staging in a runner, no repository secret is referenced
      # by this workflow, and `database_url` defaults to empty rather than
      # to anything real. This step is the assertion of that, not the only
      # thing standing in the way.)
      - name: Refuse to run against anything but this runner's own stack
        run: |
          # Everything the server talks to, and -- just as important -- every
          # address compiled into the browser bundle. The browser in this
          # suite calls the NEXT_PUBLIC_* ones, not DATABASE_URL, so a wrong
          # value there would have the test sign in against a real project
          # while the assertions still passed.
          checked=0
          while IFS='=' read -r name value; do
            [ -n "$name" ] || continue
            if [ -z "$value" ]; then
              echo "$name is not set; this job needs it" >&2
              exit 1
            fi
            case "$value" in
              http://127.0.0.1*|http://localhost*|postgresql://*@127.0.0.1:*|postgresql://*@localhost:*)
                echo "$name -> this runner, good" ;;
              *)
                echo "$name is not an address on this runner: refusing to seed or delete anything" >&2
                exit 1 ;;
            esac
            checked=$((checked + 1))
          done <<EOF
          DATABASE_URL=$DATABASE_URL
          API_DATABASE_URL=$API_DATABASE_URL
          WORKER_DATABASE_URL=$WORKER_DATABASE_URL
          ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL
          STRIPE_DATABASE_URL=$STRIPE_DATABASE_URL
          SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
          EOF
          # If someone adds a NEXT_PUBLIC_*_URL and forgets this list, say so
          # rather than letting it through unchecked.
          declared=$(env | grep -c '^NEXT_PUBLIC_.*_URL=' || true)
          if [ "$declared" -gt 2 ]; then
            echo "A NEXT_PUBLIC_*_URL exists that this guard does not check:" >&2
            env | grep '^NEXT_PUBLIC_.*_URL=' >&2
            exit 1
          fi
          echo "$checked addresses checked."
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/api/requirements.lock.txt
      - run: pip install --no-deps -e packages/core
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python scripts/ci/create_logins.py
      - name: Start the API
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
        working-directory: apps/api
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Nothing is stubbed here: a real browser, the real API, real Postgres,
      # real RLS and a real sign-in (DECISIONS.md D-166). It has its own job
      # because it needs a database and two servers, and because a failure
      # here means something different from a failure in the stubbed suite.
      # The suite builds the app itself (playwright.live.config.ts), into
      # its own directory, with this job's NEXT_PUBLIC_* compiled in.
      - name: Live end-to-end tests (playwright)
        run: npm run test:e2e:live
        working-directory: apps/web
        env:
          DOCFLOW_PYTHON: python
      - name: The API's log, if anything failed
        if: failure()
        run: cat /tmp/api.log

  core:
    name: core (lint, test, audit)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
        # Two commits: the dependency audit compares a pull request's merge
        # commit with its first parent (scripts/ci/deps_changed.sh; D-219).
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@v2.1.2
        # Normally under 10 s; hung 70 min on 2026-10-26 (run #469), cause
        # unknown. Past 5 min the job fails instead (D-218).
        timeout-minutes: 5
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Show what is listening on port 54322 before the stack starts (read-only; D-199 flake 3)
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" before
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        working-directory: ${{ github.workspace }}
        run: supabase start
      - name: Show what is listening on port 54322 after the stack failed to start, and every container (read-only; D-199 flake 3)
        if: failure() && steps.supabase.outcome == 'failure'
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" after
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      # Pinned, not ranges (H7): the worker's lockfile holds every core
      # dependency and the `files` extras; its dev file, the lint/type/test
      # tools (D-225).
      - id: deps
        run: pip install -r ../../apps/worker/requirements.lock.txt -r ../../apps/worker/requirements-dev.txt
      - id: core
        run: pip install --no-deps -e .
      - run: pip install pip-audit==2.10.1
      # Stage 5, M7 (D-214): 0039 changes policies and grants that 0036's
      # round trip compares against 0036's committed post-state, so 0039 is
      # reversed first (against staging's pre-0039 state) and put back after
      # 0038's round trip, below.
      - name: Migration 0039 forward state, then reverse (against the committed pre- and post-0039 states)
        id: roundtrip_0039_reverse
        run: python "${{ github.workspace }}/scripts/ci/migration_0039_roundtrip.py" reverse
      # Founder's Q5 condition 2 (Stage 3e): the reverse script is tested, not
      # just checked in. Before the logins are turned on, since the reverse
      # drops the roles and forward creates them again.
      # The forward state must equal supabase/reverse/0036_post_snapshot.json,
      # the committed state a database shows once 0036 is applied (founder,
      # 2026-10-05): the cutovers compare against that file (RUNBOOK 10.2).
      - name: Migration 0036 forward -> reverse -> forward (against the committed pre- and post-0036 states)
        id: roundtrip
        run: python "${{ github.workspace }}/scripts/ci/migration_roundtrip.py"
      # The state this run found, as a file, whether or not it matched.
      - name: Keep the forward state CI found
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: 0036-forward-state
          path: packages/core/0036-forward-state.json
          if-no-files-found: warn
      # Stage 4, PR 1a (D-203): 0037's reverse is tested the same way. After
      # the reverse its two columns and two indexes are gone and nothing else
      # on the two tables differs; after forward again the state is the first.
      - name: Migration 0037 forward -> reverse -> forward
        id: roundtrip_0037
        run: python "${{ github.workspace }}/scripts/ci/migration_0037_roundtrip.py"
      # Stage 4, Q14 (D-206): 0038's reverse, the same way, and what it does
      # with a document already waiting on 'database' (in a rolled-back
      # transaction): cleared to an ordinary waiting document.
      - name: Migration 0038 forward -> reverse -> forward
        id: roundtrip_0038
        run: python "${{ github.workspace }}/scripts/ci/migration_0038_roundtrip.py"
      - name: Migration 0039 forward again (must equal the first forward state)
        id: roundtrip_0039_forward
        run: python "${{ github.workspace }}/scripts/ci/migration_0039_roundtrip.py" forward
      - name: Keep the 0039 forward state CI found
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: 0039-forward-state
          path: packages/core/0039-forward-state.json
          if-no-files-found: warn
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python "${{ github.workspace }}/scripts/ci/create_logins.py"
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy docflow_core
      - name: Test (against the local Supabase stack, as the four logins)
        id: test
        run: pytest -v --junitxml=junit.xml
      - name: No unapproved skipped tests
        if: success() || failure()
        env:
          # Which earlier step failed, so a missing test report names it.
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" core junit.xml
      # D-219: a known vulnerability in what this app ships blocks only when
      # its requirements files changed; otherwise it warns, and the daily
      # audit (dependency-audit.yml) blocks on it. pip-audit reads the
      # requirements file itself, not this machine's environment; its exit
      # code is dropped and pip_audit.py decides. A report it can't read
      # fails in every case.
      - name: Did a dependency file change? (decides whether the audit blocks; D-219)
        id: deps_changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash "${{ github.workspace }}/scripts/ci/deps_changed.sh" packages/core/pyproject.toml apps/worker/requirements.lock.txt
      - name: Dependency audit (blocks when this app's requirements changed; D-219)
        run: |
          pip-audit -r ../../apps/worker/requirements.lock.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-runtime.json || true
          pip-audit -r ../../apps/worker/requirements-dev.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-dev.json || true
          python "${{ github.workspace }}/scripts/ci/pip_audit.py" core --blocking "${{ steps.deps_changed.outputs.blocking }}" runtime=pip-audit-runtime.json dev=pip-audit-dev.json
      # D-215: CLAUDE.md is capped at 28k tokens, checked as characters.
      # Runs even when an earlier step failed, so it never hides their result.
      - name: CLAUDE.md size (cap ~28k tokens; founder rule in CLAUDE.md, D-215)
        if: success() || failure()
        run: python3 "${{ github.workspace }}/scripts/ci/check_claude_md_size.py"

  api:
    name: api (lint, typecheck, test, audit)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
        # Two commits: the dependency audit compares a pull request's merge
        # commit with its first parent (scripts/ci/deps_changed.sh; D-219).
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@v2.1.2
        # Normally under 10 s; hung 70 min on 2026-10-26 (run #469), cause
        # unknown. Past 5 min the job fails instead (D-218).
        timeout-minutes: 5
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Show what is listening on port 54322 before the stack starts (read-only; D-199 flake 3)
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" before
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        working-directory: ${{ github.workspace }}
        run: supabase start
      - name: Show what is listening on port 54322 after the stack failed to start, and every container (read-only; D-199 flake 3)
        if: failure() && steps.supabase.outcome == 'failure'
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" after
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - id: deps
        run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - id: core
        run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit==2.10.1
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python "${{ github.workspace }}/scripts/ci/create_logins.py"
      # Stage 3c: the catalog tests run the worker's parse step
      # (catalog_import.run_parse), which reads through the real parse service
      # image, as in the worker job.
      - uses: docker/setup-buildx-action@v4
      - name: Build the parse service image
        id: parse_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/parse/Dockerfile
          tags: docflow-parse:ci
          load: true
          build-args: ${{ inputs.debian_snapshot && format('DEBIAN_SNAPSHOT={0}', inputs.debian_snapshot) || '' }}
          cache-from: type=gha,scope=parse
      - name: Start the parse service (production mode, isolation on)
        id: parse_service
        env:
          PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci serve
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy app
      - name: Test (against the local Supabase stack, as the four logins; live_api deselected)
        id: test
        env:
          # Never PARSE_SERVICE_TOKEN here: the API doesn't hold the parse
          # token. Only the harness that runs worker code reads this name
          # (tests/conftest.py as_the_worker; test_parse_token_boundary.py).
          WORKER_HARNESS_PARSE_TOKEN: ci-parse-token-not-a-secret
        run: pytest -v --junitxml=junit.xml
      - name: No unapproved skipped tests
        if: success() || failure()
        env:
          # Which earlier step failed, so a missing test report names it.
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" api junit.xml
      # D-219: a known vulnerability in what this app ships blocks only when
      # its requirements files changed; otherwise it warns, and the daily
      # audit (dependency-audit.yml) blocks on it. pip-audit reads the
      # requirements file itself, not this machine's environment; its exit
      # code is dropped and pip_audit.py decides. A report it can't read
      # fails in every case.
      - name: Did a dependency file change? (decides whether the audit blocks; D-219)
        id: deps_changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash "${{ github.workspace }}/scripts/ci/deps_changed.sh" apps/api/requirements.txt apps/api/requirements.lock.txt
      - name: Dependency audit (blocks when this app's requirements changed; D-219)
        run: |
          pip-audit -r requirements.lock.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-runtime.json || true
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-dev.json || true
          python "${{ github.workspace }}/scripts/ci/pip_audit.py" api --blocking "${{ steps.deps_changed.outputs.blocking }}" runtime=pip-audit-runtime.json dev=pip-audit-dev.json
      # D-225: what the image installs, on its own: a fresh venv built with the
      # Dockerfile's pip lines alone (no dev file), then pip check and an import
      # of every module of app and docflow_core. It needs only the checkout and
      # Python, so it runs whatever the tests did.
      - name: Image check (the Dockerfile's install lines alone; pip check; every module imports)
        id: image_check
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: python "${{ github.workspace }}/scripts/ci/image_check.py" api

  worker:
    name: worker (lint, typecheck, test, audit)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/worker
    # The worker's own login (Stage 3e): its tenant sessions run as
    # docflow_worker, as on Fly.
    env:
      DATABASE_URL: postgresql://docflow_worker:ci-local-only@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
        # Two commits: the dependency audit compares a pull request's merge
        # commit with its first parent (scripts/ci/deps_changed.sh; D-219).
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@v2.1.2
        # Normally under 10 s; hung 70 min on 2026-10-26 (run #469), cause
        # unknown. Past 5 min the job fails instead (D-218).
        timeout-minutes: 5
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Show what is listening on port 54322 before the stack starts (read-only; D-199 flake 3)
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" before
      - name: Start the local Supabase stack (applies supabase/migrations/)
        id: supabase
        working-directory: ${{ github.workspace }}
        run: supabase start
      - name: Show what is listening on port 54322 after the stack failed to start, and every container (read-only; D-199 flake 3)
        if: failure() && steps.supabase.outcome == 'failure'
        continue-on-error: true
        run: bash "${{ github.workspace }}/scripts/ci/show_port_54322.sh" after
      - name: Point Storage at this runner's own bucket (Stage 3b)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/local_storage_env.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - id: deps
        run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - id: core
        run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit==2.10.1
      - name: Turn on the four logins (migration 0036 creates them), as RUNBOOK 10.2 does
        id: app_role
        run: python "${{ github.workspace }}/scripts/ci/create_logins.py"
      # Stage 3c: the worker no longer opens files. Its tests read through the
      # real parse service image (isolation on, production mode), built here
      # from the parse job's layer cache.
      - uses: docker/setup-buildx-action@v4
      - name: Build the parse service image
        id: parse_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/parse/Dockerfile
          tags: docflow-parse:ci
          load: true
          build-args: ${{ inputs.debian_snapshot && format('DEBIAN_SNAPSHOT={0}', inputs.debian_snapshot) || '' }}
          cache-from: type=gha,scope=parse
      - name: Start the parse service (production mode, isolation on)
        id: parse_service
        env:
          PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci serve
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy app
      - name: Test (against the local Supabase stack, as the four logins)
        id: test
        env:
          PARSE_SERVICE_URL: http://127.0.0.1:8100
          PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
          # Test F5 kills and restarts this container mid-request.
          PARSE_CONTAINER: docflow-parse
        run: pytest -v --junitxml=junit.xml
      - name: No unapproved skipped tests
        if: success() || failure()
        env:
          # Which earlier step failed, so a missing test report names it.
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" worker junit.xml
      # D-219: a known vulnerability in what this app ships blocks only when
      # its requirements files changed; otherwise it warns, and the daily
      # audit (dependency-audit.yml) blocks on it. pip-audit reads the
      # requirements file itself, not this machine's environment; its exit
      # code is dropped and pip_audit.py decides. A report it can't read
      # fails in every case.
      - name: Did a dependency file change? (decides whether the audit blocks; D-219)
        id: deps_changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash "${{ github.workspace }}/scripts/ci/deps_changed.sh" apps/worker/requirements.txt apps/worker/requirements.lock.txt
      - name: Dependency audit (blocks when this app's requirements changed; D-219)
        run: |
          pip-audit -r requirements.lock.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-runtime.json || true
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-dev.json || true
          python "${{ github.workspace }}/scripts/ci/pip_audit.py" worker --blocking "${{ steps.deps_changed.outputs.blocking }}" runtime=pip-audit-runtime.json dev=pip-audit-dev.json
      # D-225: as in the api job.
      - name: Image check (the Dockerfile's install lines alone; pip check; every module imports)
        id: image_check
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: python "${{ github.workspace }}/scripts/ci/image_check.py" worker

  parse:
    # Stage 3c: the parse service. CI is the only place before Fly where the
    # real sandbox runs (dev is Windows): this job builds the production
    # image and exercises the real namespaces, cgroups (v2 here; Fly is v1,
    # so the Fly B tests gate production, RUNBOOK 8.1), seccomp and limits.
    name: parse service (lint, unit, image, sandbox, limits, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/parse
    env:
      PARSE_SERVICE_TOKEN: ci-parse-token-not-a-secret
      # Test D2: re-encoded images are compared by size off the machine the
      # baseline was recorded on (tests/test_parity.py says why).
      PARITY_REENCODED: size
    steps:
      - uses: actions/checkout@v7
        # Two commits: the dependency audit compares a pull request's merge
        # commit with its first parent (scripts/ci/deps_changed.sh; D-219).
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/parse/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - id: deps
        run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - id: core
        run: pip install --no-deps -e ../../packages/core -e .
      - run: pip install pip-audit==2.10.1
      # LibreOffice's .debs (about 97 MB) are cached, so the install no longer
      # downloads them from the mirror on every run (D-222). The key changes with
      # the runner image; the fallback key restores the last image's .debs, and
      # apt checks each one against the signed package lists before using it.
      # The cache steps never fail the job: a slow or failed restore means the
      # install downloads, as before.
      - name: LibreOffice cache key
        id: lo_key
        run: |
          mkdir -p ~/apt-libreoffice/partial
          prefix="libreoffice-debs-${RUNNER_OS}-${ImageOS:-unknown}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion:-unknown}-v1" >> "$GITHUB_OUTPUT"
      - name: Restore LibreOffice's .debs
        id: lo_cache
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-libreoffice/*.deb
          key: ${{ steps.lo_key.outputs.key }}
          restore-keys: ${{ steps.lo_key.outputs.prefix }}
      - name: Install LibreOffice (the in-process .doc tests)
        id: libreoffice
        # Normally under a minute; stalled 25–45 min four times on 2026-10-23 on
        # a slow mirror. Past 15 min the job fails instead (D-218).
        # From D-222 the .debs come from the cache, so the mirror matters on a miss.
        timeout-minutes: 15
        env:
          RESTORE_OUTCOME: ${{ steps.lo_cache.outcome }}
          CACHE_HIT: ${{ steps.lo_cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.lo_cache.outputs.cache-matched-key }}
        run: |
          set -o pipefail
          if [ "$RESTORE_OUTCOME" != "success" ]; then
            cache="restore failed or timed out; downloading"
          elif [ "$CACHE_HIT" = "true" ]; then
            cache="hit ($MATCHED_KEY)"
          elif [ -n "$MATCHED_KEY" ]; then
            cache="partial, an earlier image's .debs ($MATCHED_KEY)"
          else
            cache="miss; downloading"
          fi
          echo "::notice title=LibreOffice cache::$cache"
          sudo apt-get update
          echo "::notice title=LibreOffice install::apt-get update finished at $(date -u +%H:%M:%SZ)"
          # apt reuses a cached .deb whose name and size match without checking
          # its hash, so each one is checked here against the signed lists just
          # read; one whose hash or name doesn't match is deleted and downloaded
          # again. The check runs in its own shell: if it fails, every cached
          # .deb is deleted and all are downloaded, so only apt fails this step.
          check_cached_debs() {
            shopt -s nullglob
            local checked=0 dropped=0 deb pkg ver arch want have
            for deb in "$HOME"/apt-libreoffice/*.deb; do
              checked=$((checked + 1))
              pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null) || pkg=""
              ver=$(dpkg-deb -f "$deb" Version 2>/dev/null) || ver=""
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null) || arch=""
              want=$(apt-cache show --no-all-versions "$pkg=$ver" 2>/dev/null | sed -n 's/^SHA256: //p' | head -1)
              have=$(sha256sum < "$deb")
              have=${have%% *}
              # apt names the file package_version_arch.deb, the epoch's ":" as "%3a"
              if [ -z "$want" ] || [ "$have" != "$want" ] || [ "${deb##*/}" != "${pkg}_${ver//:/%3a}_${arch}.deb" ]; then
                echo "dropping ${deb##*/}: not in the signed lists, or its hash or name differs"
                rm -f "$deb"
                dropped=$((dropped + 1))
              fi
            done
            echo "::notice title=LibreOffice cache::$checked cached .debs checked against the signed lists, $dropped dropped"
          }
          export -f check_cached_debs
          if ! bash -e -c check_cached_debs; then
            sudo rm -f "$HOME"/apt-libreoffice/*.deb || true
            echo "::notice title=LibreOffice cache::the check of the cached .debs failed, so all of them were deleted; downloading"
          fi
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-libreoffice/" \
            -o APT::Keep-Downloaded-Packages=true \
            libreoffice-writer | tee "$RUNNER_TEMP/apt-install.txt"
          need=$(grep -m1 '^Need to get' "$RUNNER_TEMP/apt-install.txt" || echo "no download line")
          echo "::notice title=LibreOffice install::$need"
      - name: Prepare LibreOffice's .debs for the cache
        id: lo_prep
        if: steps.lo_cache.outputs.cache-hit != 'true' && steps.libreoffice.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-libreoffice/"
          sudo chown -R "$(id -u):$(id -g)" ~/apt-libreoffice
          shopt -s nullglob
          debs=(~/apt-libreoffice/*.deb)
          size=$(du -cm "${debs[@]}" /dev/null | tail -1 | cut -f1)
          echo "::notice title=LibreOffice cache::${#debs[@]} .debs, ${size} MB, to save as ${{ steps.lo_key.outputs.key }}"
      - name: Save LibreOffice's .debs
        if: steps.lo_prep.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/apt-libreoffice/*.deb
          key: ${{ steps.lo_key.outputs.key }}
      - id: ruff
        run: ruff check .
      - id: mypy
        run: mypy parse_service
      - name: Unit tests (in-process; logic only, never proof of isolation)
        id: unit
        run: pytest -v --junitxml=junit-unit.xml
      - name: No unapproved skipped tests (unit)
        if: success() || failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" parse junit-unit.xml
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/parse/Dockerfile
          tags: docflow-parse:ci
          load: true
          build-args: ${{ inputs.debian_snapshot && format('DEBIAN_SNAPSHOT={0}', inputs.debian_snapshot) || '' }}
          cache-from: type=gha,scope=parse
          cache-to: type=gha,mode=max,scope=parse
      - name: "E1: refuses to start without the privileges isolation needs"
        id: e1
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci e1
      - name: "E4: refuses to start without a working memory cap"
        id: e4
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci e4
      - name: "E3: start the service (production mode); its canary log"
        id: serve
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci serve
      # The mutation corpus (D-203, PR 1b-i): 369 broken files, each answered
      # by a real sandboxed job -- the recorded answer, never `error`.
      - name: "HTTP tests against the real image (C1, C2, D1, D2, D3, N4, the mutation corpus)"
        id: http
        env:
          PARSE_SERVICE_URL: http://127.0.0.1:8100
        run: pytest -v tests/test_parity.py tests/test_service.py tests/test_mutation_corpus.py --durations=10 --junitxml=junit-http.xml
      - name: No unapproved skipped tests (HTTP)
        if: success() || failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python "${{ github.workspace }}/scripts/ci/check_skips.py" parse junit-http.xml
      - name: "Self-tests in the real sandbox (A, S, B), each with its control"
        id: selftest
        if: success() || failure()
        run: bash "${{ github.workspace }}/scripts/ci/parse_image.sh" docflow-parse:ci selftest
      - name: The self-test evidence, as annotations
        if: success() || failure()
        run: python "${{ github.workspace }}/scripts/ci/selftest_annotations.py" parse-selftest.txt
      - name: Keep the self-test evidence
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: parse-selftest
          path: apps/parse/parse-selftest.txt
          if-no-files-found: warn
      - name: The service's log
        if: success() || failure()
        run: docker logs docflow-parse 2>&1 | tail -200 || true
      # D-219: a known vulnerability in what this app ships blocks only when
      # its requirements files changed; otherwise it warns, and the daily
      # audit (dependency-audit.yml) blocks on it. pip-audit reads the
      # requirements file itself, not this machine's environment; its exit
      # code is dropped and pip_audit.py decides. A report it can't read
      # fails in every case.
      - name: Did a dependency file change? (decides whether the audit blocks; D-219)
        id: deps_changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash "${{ github.workspace }}/scripts/ci/deps_changed.sh" apps/parse/requirements.txt apps/parse/requirements.lock.txt
      - name: Dependency audit (runtime blocks when its requirements changed; dev tools warn; D-219)
        run: |
          pip-audit -r requirements.lock.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-runtime.json || true
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --strict --progress-spinner off -f json -o pip-audit-dev.json || true
          python "${{ github.workspace }}/scripts/ci/pip_audit.py" parse --blocking "${{ steps.deps_changed.outputs.blocking }}" runtime=pip-audit-runtime.json dev=pip-audit-dev.json
