name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: web (lint, typecheck, test, build, e2e, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build MUST come before `tsc --noEmit`. Next generates the global
      # route types -- `LayoutProps`, `PageProps` -- into `.next/types` as
      # part of the build, and `src/app/layout.tsx` uses `LayoutProps`. On a
      # clean checkout those types do not exist yet, so a typecheck run first
      # fails with "Cannot find name 'LayoutProps'". This job had never
      # passed in CI for exactly that reason; see DECISIONS.md D-087.
      - run: npm run build
      - run: npx tsc --noEmit
      # Component tests before the browser: they are seconds, and a failure
      # here explains an e2e failure that would otherwise take a browser to
      # diagnose.
      - name: Component tests (vitest)
        run: npm test
      # The review flow in a real browser (CLAUDE.md Section 6, Phase 3).
      # The API is stubbed at the network boundary -- its own behaviour is
      # proven against real Postgres in the api job below.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (playwright)
        run: npm run test:e2e
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

  core:
    name: core (lint, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pip install pip-audit
      - run: ruff check .
      - name: Test (no DATABASE_URL -- DB-dependent tests skip cleanly)
        run: pytest -v
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  api:
    name: api (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock.txt
      - run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit
      - run: ruff check .
      - run: mypy app
      - name: Test (recorded-fixture tests only -- DB-dependent tests skip cleanly without DATABASE_URL)
        run: pytest -v
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit

  worker:
    name: worker (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock.txt
      - run: pip install --no-deps -e ../../packages/core
      - run: pip install pip-audit
      - run: ruff check .
      - run: mypy app
      - run: pytest -v
      - name: Dependency audit (fail on known vulnerabilities)
        run: pip-audit
